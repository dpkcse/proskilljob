name: proskill_candidate
description: ProSkill candidate mobile application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_html: ^3.0.0-beta.2
  image_picker: ^1.1.2
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.1
  file_picker: ^12.1.2
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#070B20"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/proskill_job_logo.png
    - assets/branding/app_icon.png
    - assets/branding/proskill_loading_mark.png
